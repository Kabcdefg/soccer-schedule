<style>

  var KEY = "ss_gate_key";
  var b64 = function (s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var unb64 = function (a) { var s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var store = function () { try { return window.localStorage; } catch (e) { return null; } };
  var msg = function (t) { document.getElementById("msg").textContent = t || ""; };

  async function deriveRaw(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  async function tryStored() {
    var s = store(); if (!s) return false;
    var k = s.getItem(KEY); if (!k) return false;
    try { show(await decrypt(b64(k))); return true; } catch (e) { s.removeItem(KEY); return false; }
  }

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    if (!pw) return;
    var btn = document.getElementById("go");
    btn.disabled = true; msg("確認中…");
    try {
      var raw = await deriveRaw(pw);
      var html = await decrypt(raw);
      var s = store();
      if (s && document.getElementById("keep").checked) s.setItem(KEY, unb64(raw));
      show(html);
    } catch (e) {
      msg("パスワードが違います"); btn.disabled = false;
    }
  });
  tryStored();
})();
